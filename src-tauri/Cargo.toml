[package]
name = "ascad-fullsystem"
version = "1.0.0"
description = "ASCAD-FullSystem - Advanced Schematic Design and Logic Laboratory"
authors = ["Siyabonga Blessing Phakathi"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Thin LTO + parallel codegen units: on this 3.9 GB RAM / ~1 GB-free host,
# fat LTO (lto = true + codegen-units = 1) is an OOM/swap risk with ~500 crates.
panic = "abort"
strip = true
lto = "thin"
codegen-units = 16
